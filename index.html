<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>書籍管理系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid #ddd;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>書籍管理系統</h1>
    <div id="form-container">
        <h2>新增/修改書籍</h2>
        <div class="form-group">
            <label for="book-id">書本編號</label>
            <input type="text" id="book-id">
        </div>
        <div class="form-group">
            <label for="book-title">書本名稱</label>
            <input type="text" id="book-title">
        </div>
        <div class="form-group">
            <label for="book-category">書類別</label>
            <input type="text" id="book-category">
        </div>
        <div class="form-group">
            <label for="book-author">作者</label>
            <input type="text" id="book-author">
        </div>
        <div class="form-group">
            <label for="book-price">價格</label>
            <input type="text" id="book-price">
        </div>
        <button onclick="addBook()">新增書籍</button>
    </div>

    <h2>書籍列表</h2>
    <table>
        <thead>
            <tr>
                <th>編號</th>
                <th>名稱</th>
                <th>類別</th>
                <th>作者</th>
                <th>價格</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="book-list">
            <!-- 書籍資料將動態插入 -->
        </tbody>
    </table>

    <script>
        // 從伺服器獲取書籍列表
        async function fetchBooks() {
            const response = await fetch('/books');
            const books = await response.json();
            const bookList = document.getElementById('book-list');
            bookList.innerHTML = ''; // 清空列表
            books.forEach(book => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.category}</td>
                    <td>${book.author}</td>
                    <td>${book.price}</td>
                    <td>
                        <button onclick="deleteBook('${book.id}')">刪除</button>
                    </td>
                `;
                bookList.appendChild(row);
            });
        }

        // 新增書籍
        async function addBook() {
            const book = {
                id: document.getElementById('book-id').value,
                title: document.getElementById('book-title').value,
                category: document.getElementById('book-category').value,
                author: document.getElementById('book-author').value,
                price: document.getElementById('book-price').value,
            };
            await fetch('/books', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book),
            });
            fetchBooks(); // 更新列表
        }

        // 刪除書籍
        async function deleteBook(id) {
            await fetch(`/books/${id}`, { method: 'DELETE' });
            fetchBooks(); // 更新列表
        }

        // 頁面載入時獲取書籍列表
        fetchBooks();
    </script>
</body>
</html>
